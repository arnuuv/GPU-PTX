[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptxlab"
version = "0.1.0"
description = "Educational NVIDIA PTX compiler backend and CPU software execution simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["streamlit>=1.33"]
dev = ["pytest>=8.0"]

[project.scripts]
ptxlab = "ptxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
