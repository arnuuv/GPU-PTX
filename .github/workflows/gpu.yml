name: gpu

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: [self-hosted, nvidia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Require a CUDA device
        run: nvidia-smi
      - run: python -m ptxlab validate examples/vector_add.py --backend cuda
      - run: python -m ptxlab validate examples/saxpy.py --backend cuda
      - run: python -m ptxlab bench --backend cuda
